name: colonial-heritage-genealogy
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-5186}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "${CLUB_HOSTS:-localhost;127.0.0.1}"
      Club__DataDirectory: /data
      Club__ProxyAddress: "${PROXY_GATEWAY:-172.29.186.1}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    volumes:
      - club-data:/data
    networks:
      - club

volumes:
  club-data:

networks:
  club:
    ipam:
      config:
        - subnet: "${PROXY_SUBNET:-172.29.186.0/24}"
          gateway: "${PROXY_GATEWAY:-172.29.186.1}"
